# Versions checked against the actual Maven metadata on 2026-08-01, not guessed.
#
# NOTE: These are NOT the newest releases, and that is forced, not conservatism.
#
# The androidx line has moved to requiring AGP 9.1+ and `compileSdk 37`
# (core-ktx 1.19.0, lifecycle 2.11.0 and activity-compose 1.13.0 all fail the
# build with exactly that message). But `platforms;android-37` is not in the SDK
# repository yet — `sdkmanager "platforms;android-37"` returns "Failed to find
# package" — so compileSdk 36 is a ceiling we cannot raise, whatever AGP we use.
# Hence AGP 8.13.2 and the last androidx releases that still compile against 36.
#
# To move forward later: install platforms;android-37 once it exists, then bump
# compileSdk, AGP, and all four androidx versions together. They are one
# decision, not four.
[versions]
agp = "8.13.2"
kotlin = "2.4.10"
coreKtx = "1.17.0"
lifecycle = "2.9.4"
activityCompose = "1.11.0"
composeBom = "2025.12.01"
media3 = "1.11.0"
# 1.1.0 is the newest stable release. Everything past it (1.2.0-alphaNN,
# 1.4.0-alphaNN) is still alpha per Google's own metadata — there is no
# 1.2.0/1.3.0 stable to skip to.
biometric = "1.1.0"
# BiometricPrompt requires a FragmentActivity. biometric:1.1.0 pulls in
# fragment:1.2.5 transitively (confirmed via `dependencies`), which is old
# enough to conflict with androidx.activity's registerForActivityResult
# request-code range. Pinned forward explicitly rather than relying on the
# transitive version. 1.9.1 is newer but stayed off the same compileSdk-37
# ceiling documented above for the rest of this androidx line — untested here.
fragment = "1.8.9"
junit = "4.13.2"
androidxTestExtJunit = "1.2.1"
androidxTestRunner = "1.6.2"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
androidx-media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
androidx-media3-ui = { group = "androidx.media3", name = "media3-ui", version.ref = "media3" }
androidx-biometric = { group = "androidx.biometric", name = "biometric", version.ref = "biometric" }
androidx-fragment = { group = "androidx.fragment", name = "fragment", version.ref = "fragment" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestExtJunit" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidxTestRunner" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
